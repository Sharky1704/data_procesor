services:
  dataproc:   #Python container executed as the dataproc user
    build:
      context: /opt/dataproc
      dockerfile: Dockerfile
    image: dataproc:latest
    user: "2048:2048"
    restart: unless-stopped
    expose:
      - "5000"

  nginx:    #Nginx cotainer 
    image: nginx:stable
    user: "2048:2048"
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - /opt/dataproc/nginx.conf:/etc/nginx/nginx.conf:ro   #Nginx.conf read-only
      - /var/log/nginx/custom-access.log:/var/log/nginx/custom-access.log   #Nginx custom access-logs
    depends_on:
      - dataproc