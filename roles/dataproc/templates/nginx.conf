events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/custom-access.log;

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://dataproc:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}